# Companies to watch.
#
# Each entry needs a `name`. `website` / `careersUrl` help `npm run discover` find the job board.
# `ats` says how to read the job list:
#
#   greenhouse | lever | lever-eu | ashby | workable | recruitee | personio | teamtailor
#   smartrecruiters | bamboohr   -> need `slug` (the company's id on that platform)
#   workday                      -> needs `url` (the myworkdayjobs.com careers page)
#   html                         -> needs `url`, optional `linkPattern` (regex matched against job link hrefs)
#   manual                       -> skipped; listed in the report as "check by hand"
#   unknown                      -> not found yet; run `npm run discover`
#
# `verify: true` means discover guessed the slug by probing, rather than finding a link on the company's
# own site. Check those once (open the board, confirm it is the right company) and delete the flag.
# `enabled: false` pauses a company without deleting it.

